name: 'validate-actions'
description: 'Validates that every action used by the GitHub workflow files is on the ASF Infra approved list'
inputs:
  workflows-dir:
    description: 'Directory containing the workflow files to validate, relative to the repository root'
    required: false
    default: '.github/workflows'
  approved-patterns-url:
    description: 'URL of the approved_patterns.yml allowlist. Defaults to the ASF infrastructure-actions copy'
    required: false
    default: 'https://raw.githubusercontent.com/apache/infrastructure-actions/main/approved_patterns.yml'
  actions-url:
    description: 'URL of the actions.yml SHA-to-tag mapping. Defaults to the ASF infrastructure-actions copy'
    required: false
    default: 'https://raw.githubusercontent.com/apache/infrastructure-actions/main/actions.yml'
runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    WORKFLOWS_DIR: ${{ inputs.workflows-dir }}
    APPROVED_PATTERNS_URL: ${{ inputs.approved-patterns-url }}
    ACTIONS_URL: ${{ inputs.actions-url }}
